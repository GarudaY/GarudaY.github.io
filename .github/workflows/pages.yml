name: Deploy GitHub Pages

on:
  push:
    branches:
      - source
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out application source
        uses: actions/checkout@v6
        with:
          ref: code

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check code
        run: npm run lint

      - name: Check static export preparation
        run: npm run test:pages

      - name: Check localized routing
        run: npm run test:routing

      - name: Check published CMS schemas and editor
        run: node --experimental-strip-types --test scripts/test-cms-updates.mjs scripts/test-cms-people.mjs scripts/test-cms-courses.mjs scripts/test-cms-events.mjs scripts/test-cms-volunteer.mjs scripts/test-cms-partners.mjs scripts/test-cms-admin.mjs

      - name: Check email routing and donation QR
        run: npm run test:notifications

      - name: Build static site
        run: npm run build:pages
        env:
          WORDPRESS_CMS_URL: ${{ vars.WORDPRESS_CMS_URL }}
          WORDPRESS_CMS_HTTP_USER: ${{ secrets.WORDPRESS_CMS_HTTP_USER }}
          WORDPRESS_CMS_HTTP_PASSWORD: ${{ secrets.WORDPRESS_CMS_HTTP_PASSWORD }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_API_MODE: wordpress

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
